# ============================================================================
# Zensical configuration for the Initiative documentation site.
#
# Build locally:   zensical serve     (preview at http://localhost:8000)
# Build static:    zensical build     (output in ./site)
#
# Content lives under docs/en/ so that other languages (e.g. docs/es/) can be
# added later without restructuring. See docs/en/running-a-server/maintaining-these-docs.md.
# ============================================================================

[project]

site_name = "Initiative Help"
site_description = "Guides and reference for Initiative — collaborative project management for small businesses, clubs, event teams, and families."
site_author = "BeyondersStudio"

# The canonical URL for the published site (powers search, the sitemap, and
# social previews). For GitHub Pages on this repo it's the project URL below.
# If you later use a custom domain, change this to that domain (e.g.
# "https://docs.initiative.app/").
site_url = "https://beyonders-studio.github.io/initiative/"

# Link the header logo/title back to the source repository.
repo_url = "https://github.com/beyonders-studio/initiative"
repo_name = "beyonders-studio/initiative"

copyright = """
Copyright &copy; 2026 BeyondersStudio
"""

# Bring your own styling for the "screenshot placeholder" and "technical
# details" callouts used throughout these docs.
extra_css = ["stylesheets/extra.css"]

# ----------------------------------------------------------------------------
# Navigation. Paths are relative to the docs directory. The English tree lives
# under en/; to add a language later, copy en/ to a new language folder and add
# a parallel block here (and a language switcher) once translations exist.
# ----------------------------------------------------------------------------
