    "en/getting-started/install-the-app.md",
    "en/getting-started/a-quick-tour.md",
    "en/getting-started/your-first-community.md",
  ] },
  { "How Initiative is organized" = [
    "en/concepts/index.md",
  ] },
  { "Using Initiative" = [
    "en/guides/index.md",
    "en/guides/communities.md",
    "en/guides/initiatives.md",
    { "Tools" = [
      "en/guides/tools.md",
      "en/guides/layouts.md",
      "en/guides/projects-and-tasks.md",
      "en/guides/files.md",
      "en/guides/calendar.md",
      "en/guides/queues.md",
      "en/guides/counters.md",
      "en/guides/dashboards.md",
      "en/guides/posts.md",
      "en/guides/wikis.md",
    ] },
    "en/guides/plugins-and-marketplace.md",
    "en/guides/tags.md",
    "en/guides/your-space.md",
    "en/guides/messages.md",
    "en/guides/search-and-shortcuts.md",
    "en/guides/mentions-and-links.md",
    "en/guides/notifications.md",
  ] },
  { "Sharing & access" = [
    "en/sharing/index.md",
    "en/sharing/initiative-roles.md",
    "en/sharing/sharing-projects-and-files.md",
    "en/sharing/guests.md",
  ] },
  { "Security & privacy" = [
    "en/security/index.md",
    "en/security/how-your-data-is-kept-separate.md",
    "en/security/community-security.md",
    "en/security/private-messages.md",
