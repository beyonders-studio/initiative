[pytest]
# Pytest configuration for Initiative backend tests

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Strict markers - fail on unknown markers
    --strict-markers
    # The seam conformance suite and the budgets run on request: pytest -m seam,
    # pytest -m budget
    -m "not seam and not budget"

markers =
    seam: the request-context conformance suite (app/db/seam_conformance_test.py); deselected by default
    fresh_guild_schema: build and drop this test's guild schemas instead of reusing pooled ones (app/testing/guild_pool.py)
    budget: what a community costs the database, held nightly (app/db/budgets_test.py); deselected by default
    quarantine(issue, since): a flaky test, out of every run but --quarantined (app/testing/run_options.py)
    always: runs on every pull request whatever it changed: checks across every table, route, registry or migration, which a new file can break without touching them (see CLAUDE.md, Running Tests)

# Parallelism is per-invocation, not an addopt, because the right answer depends
# on how much work the run has. Every worker pays the app import and its own
# session setup, and each gets its own database and role prefix (conftest.py):
#
#   pytest -n auto app/      a big run amortises that — measured 6m29s -> 1m52s
#                            on app/services (1363 tests, 16 cores)
#   pytest path/to/one_test.py
#                            a targeted run does not — 16 workers spend longer
#                            starting up than the tests take. Serial is the
#                            default for exactly this case.
#
# CI passes -n auto for the whole suite; scripts/test-changed.sh does the same
# when a shared-infrastructure change makes it run everything.

# Coverage is opt-in, not part of addopts: instrumenting every import roughly
# doubles the wall time of a targeted run, and nothing consumes the report on
# the normal path. Ask for it when you want it:
#   pytest --cov=app --cov-config=.coveragerc --cov-report=term-missing --cov-branch

# A warning is a failure. Deprecations we own get fixed at the call site rather
# than accumulating until the library removes them; everything below is a
# warning we do not raise and cannot fix here, and each says why it is here so
# the list can be re-checked when a dependency moves.
filterwarnings =
    error
    # Starlette renamed two status constants and warns from inside its own
    # exception handling and FastAPI's router, where we do not pass them. Ours
    # use the new names. StarletteDeprecationWarning is a UserWarning, not a
    # DeprecationWarning, so that is the category to name.
    ignore:'HTTP_4[0-9][0-9]_[A-Z_]+' is deprecated:UserWarning
    # anyio's pytest plugin imports CallSpec2, which pytest 9.2 renamed. anyio
    # 4.16 imports the new name but deprecates the BlockingPortal alias that
    # Starlette's TestClient reads, and the Starlette that reads the new one
    # answers some 204 routes with no response, so both stay put for now.
    ignore:_pytest.python.CallSpec2 has been renamed to CallSpec:pytest.PytestRemovedIn10Warning
    # The setup session and the request path are deliberately two connections
    # (conftest: real roles rather than a superuser that hides RLS bugs), so a
    # row written on one and deleted on the other is a miss SQLAlchemy counts,
    # and an object flushed on one replaces the other's identity. Both are
    # properties of the harness, not of the code under test.
    ignore:DELETE statement on table .* expected to delete:sqlalchemy.exc.SAWarning
    ignore:Identity map already had an identity for:sqlalchemy.exc.SAWarning
    ignore:New instance .* conflicts with persistent instance:sqlalchemy.exc.SAWarning

# Test paths
testpaths = app alembic

# Ignore patterns
norecursedirs = .git .venv __pycache__ *.egg-info

# Minimum Python version
minversion = 3.11
