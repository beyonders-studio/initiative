overrides:
  # These are transitive packages held below patched releases. js-yaml is
  # tooling-only, while mermaid is also part of the production whiteboard
  # through @excalidraw/excalidraw -> @excalidraw/mermaid-to-excalidraw, and
  # dompurify comes in through both mermaids.
  # sharp is used by the asset tooling. Caret rather than a bare floor --
  # '>=' let js-yaml 5.x through into a tool asking for 4.x when this was
  # first tried.
  js-yaml@<4.3.2: ^4.3.2
  # The browser MCP server (.mcp.json) runs the Playwright @playwright/test
  # installs, so the two always want the same Chromium, whichever moves.
  '@playwright/mcp>playwright': $@playwright/test
  '@playwright/mcp>playwright-core': $@playwright/test
  sharp@<0.35.4: ^0.35.4
  fast-uri@<3.1.6: ^3.1.6
  mermaid@<11.16.1: ^11.16.1
  dompurify@<3.4.17: ^3.4.17
  '@xmldom/xmldom@<0.9.11': ^0.9.11
  '@radix-ui/react-dismissable-layer': 1.1.20
  '@radix-ui/react-focus-guards': 1.1.6
