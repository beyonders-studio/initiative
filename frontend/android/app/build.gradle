apply plugin: 'com.android.application'

// Read version from VERSION file at project root
def versionFile = file("../../../VERSION")
def appVersionName = versionFile.exists() ? versionFile.text.trim() : "0.0.0"
// Convert semver to versionCode: major*10000 + minor*100 + patch
def versionParts = appVersionName.split("\\.")
if (versionParts.size() < 3) {
    throw new GradleException("VERSION file must contain semver format (e.g., 0.14.1), found: ${appVersionName}")
}
def appVersionCode = versionParts[0].toInteger() * 10000 + versionParts[1].toInteger() * 100 + versionParts[2].toInteger()

// Release signing values arrive as Gradle properties. Each name is a plain
// identifier, so the same value can be supplied as an
// ORG_GRADLE_PROJECT_<name> environment variable.
def signingPropertyNames = [
    storeFile    : 'initiativeSigningStoreFile',
    storePassword: 'initiativeSigningStorePassword',
    keyAlias     : 'initiativeSigningKeyAlias',
    keyPassword  : 'initiativeSigningKeyPassword',
]
def signingValues = signingPropertyNames.collectEntries { name, property ->
    def value = findProperty(property)?.toString()?.trim()
    [(name): (value ? value : null)]
}
def missingSigningProperties = signingPropertyNames
    .findAll { name, property -> !signingValues[name] }
    .values()
    .toList()
def releaseIsSigned = missingSigningProperties.isEmpty()
// A partial set is always a configuration mistake, so name it here rather than
// letting the build settle on unsigned output.
if (!releaseIsSigned && missingSigningProperties.size() < signingPropertyNames.size()) {
    throw new GradleException(
        "Release signing is partially configured. Missing: ${missingSigningProperties.join(', ')}"
    )
}

// The dev channel installs beside the published app: its own id and launcher
// name, from the same ORG_GRADLE_PROJECT_<name> properties.
def appIdSuffix = findProperty('initiativeAppIdSuffix')?.toString()?.trim() ?: ''
def appLabel = findProperty('initiativeAppLabel')?.toString()?.trim() ?: 'Initiative'

android {
    namespace = "studio.beyonders.initiative"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "studio.beyonders.initiative" + appIdSuffix
        // Plain-HTTP servers only in a debug build, for testing against a server on the LAN.
        manifestPlaceholders = [appLabel: appLabel, usesCleartextTraffic: "false"]
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseIsSigned) {
            release {
                storeFile file(signingValues.storeFile)
                storePassword signingValues.storePassword
                keyAlias signingValues.keyAlias
                keyPassword signingValues.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseIsSigned) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Play billing country, to decide whether a Play install may link to the web for plans.
    // Only getBillingConfigAsync is used; nothing is bought through Play.
    implementation 'com.android.billingclient:billing:8.0.0'

    // The Play Store's own review prompt, asked for after something the person finished.
    implementation 'com.google.android.play:review:2.0.2'

    // Firebase for runtime initialization (push notifications)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
