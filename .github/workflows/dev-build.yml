name: Dev Build

on:
  # A push to dev reaches this from CI, once every check has passed on it.
  workflow_call:
  # By hand from dev at any time, without waiting for CI. The ota-dev
  # environment that signs the image is open to the dev branch only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sha:
    # :dev is this repository's, signed with its dev key; a fork builds none.
    if: ${{ github.repository == 'beyonders-studio/initiative' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      short: ${{ steps.sha.outputs.short }}
      ota-dev-key: ${{ steps.sha.outputs.ota-dev-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get short SHA
        id: sha
        run: |
          echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "ota-dev-key=$(tr -d '[:space:]' < .github/ota-dev-key.pub)" >> $GITHUB_OUTPUT

  docker:
    needs: sha
    permissions:
      contents: read
      packages: write  # the push to GHCR
      id-token: write  # the image's signature
    uses: ./.github/workflows/docker-image.yml
    with:
      name: dev
      # Signed with the dev key, which only the dev app trusts.
      signing-environment: ota-dev
      build-args: |
        VITE_VERSION_SUFFIX=-dev-${{ needs.sha.outputs.short }}
        VITE_OTA_DEV_PUBLIC_KEY=${{ needs.sha.outputs.ota-dev-key }}
        IMAGE_CHANNEL=dev
      # Only the commit's own tag: :dev moves in the job below.
      tags: |
        type=raw,value=dev-${{ needs.sha.outputs.short }}
    # inherit, not a list: the called job's environment secrets
    # (OTA_SIGNING_KEY) read as empty without it.
    secrets: inherit

  move-dev-tag:
    name: Move :dev
    needs: [sha, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Checked now, not when the build started: a re-run of an older run, or
      # a build that finished after a newer one, publishes its own dev-<sha>
      # and leaves :dev on the newer commit.
      - name: Point :dev at this build while it is the tip of dev
        env:
          IMAGE: ${{ needs.docker.outputs.image }}
          SHORT: ${{ needs.sha.outputs.short }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          tip=$(git ls-remote "https://github.com/$REPOSITORY" refs/heads/dev | cut -f1)
          if [[ "$tip" != "$COMMIT" ]]; then
            echo "dev is at ${tip:0:9}, not ${COMMIT:0:9}: published $IMAGE:dev-$SHORT and left :dev where it is." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker buildx imagetools create -t "$IMAGE:dev" "$IMAGE:dev-$SHORT"
          echo "$IMAGE:dev now points at dev-$SHORT." | tee -a "$GITHUB_STEP_SUMMARY"
