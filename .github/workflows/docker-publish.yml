name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.30.0) — sets Docker semver tags'
        required: false
        default: ''

jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build_android: ${{ steps.decide.outputs.build_android }}
      build_desktop: ${{ steps.decide.outputs.build_desktop }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
            echo "Version from input: $VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "Version from tag: $VERSION"
          else
            VERSION=$(cat VERSION)
            echo "Version from file: $VERSION"
          fi
          # Every later job reads this output, so it is checked once, here.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a release version (expected X.Y.Z)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build the native apps
        id: decide
        run: |
          # The Android app only needs rebuilding when the native shell changed — which
          # promote.sh records by moving MIN_NATIVE_VERSION forward. Compare this ref's value
          # against the previous release tag; web-only releases reuse the existing APK and
          # update over the air. The committed file is the single source of truth, so both the
          # workflow_dispatch and manual tag-push paths behave identically.
          cur=$(cat MIN_NATIVE_VERSION 2>/dev/null || echo "")
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$prev" ]; then
            old=$(git show "$prev:MIN_NATIVE_VERSION" 2>/dev/null || echo "")
          else
            old=""
          fi
          if [ -z "$old" ] || [ "$old" != "$cur" ]; then
            echo "build_android=true" >> "$GITHUB_OUTPUT"
            echo "Native min-version changed ('$old' -> '$cur') or no prior value — building the app."
          else
            echo "build_android=false" >> "$GITHUB_OUTPUT"
            echo "Native min-version unchanged ('$cur') — web-only release, skipping the app build."
          fi
          # The desktop app has a floor of its own, MIN_DESKTOP_VERSION, decided the same way,
          # so a desktop change builds no APK and a phone change no installers.
          cur=$(cat MIN_DESKTOP_VERSION 2>/dev/null || echo "")
          if [ -n "$prev" ]; then
            old=$(git show "$prev:MIN_DESKTOP_VERSION" 2>/dev/null || echo "")
          else
            old=""
          fi
          if [ -z "$old" ] || [ "$old" != "$cur" ]; then
            echo "build_desktop=true" >> "$GITHUB_OUTPUT"
            echo "Desktop min-version changed ('$old' -> '$cur') or no prior value — building the installers."
          else
            echo "build_desktop=false" >> "$GITHUB_OUTPUT"
            echo "Desktop min-version unchanged ('$cur') — skipping the installer build."
          fi

  build-android:
    needs: decide
    if: ${{ needs.decide.outputs.build_android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: android-release
    permissions:
      contents: read
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      # A tag build publishes to the release, so it has to sign. Checked before
      # the toolchain is installed so the job ends in seconds.
      - name: Require signing on release tags
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE != 'true' }}
        run: |
          echo "::error::This is a release tag, but no signing keystore reached the job."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-frontend

      - name: Build frontend for Capacitor
        working-directory: frontend
        run: pnpm build:capacitor

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The action's default package list still includes the obsolete `tools`
          # package, which Google has removed from the SDK repository — sdkmanager
          # exits non-zero on it. Gradle fetches the platform/build-tools it needs.
          packages: platform-tools

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Stage the signing keystore outside the workspace
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d \
            > "$RUNNER_TEMP/signing/release.jks"

      # Signing values reach Gradle as project properties named after the ones
      # app/build.gradle reads. Every name is a POSIX identifier, which is what
      # the /bin/sh gradle wrapper forwards to the build JVM.
      - name: Build signed APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        working-directory: frontend/android
        env:
          ORG_GRADLE_PROJECT_initiativeSigningStoreFile: ${{ runner.temp }}/signing/release.jks
          ORG_GRADLE_PROJECT_initiativeSigningStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_initiativeSigningKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_initiativeSigningKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # The APK is for GitHub Releases and Obtainium; the bundle (AAB) is what Google Play takes.
        run: ./gradlew assembleRelease bundleRelease

      - name: Build unsigned APK (fallback)
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        working-directory: frontend/android
        run: ./gradlew assembleRelease

      - name: Verify the APK signature
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          release_dir=frontend/android/app/build/outputs/apk/release
          apk="$release_dir/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::Signing was configured but Gradle produced no signed APK."
            ls -l "$release_dir" || true
            exit 1
          fi

          apksigner=$(find "${ANDROID_HOME:-}/build-tools" -mindepth 2 -maxdepth 2 \
            -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner was not found under the Android SDK build-tools."
            exit 1
          fi

          normalise() { tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]'; }

          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/signing/apk-certs.txt"
          apk_cert=$(awk '/certificate SHA-256 digest/ { print $NF; exit }' \
            "$RUNNER_TEMP/signing/apk-certs.txt" | normalise)

          printf '%s\n' "$KEYSTORE_PASSWORD" \
            | keytool -list -v -keystore "$RUNNER_TEMP/signing/release.jks" -alias "$KEY_ALIAS" \
            > "$RUNNER_TEMP/signing/keystore-certs.txt"
          keystore_cert=$(awk '/SHA256:/ { print $2; exit }' \
            "$RUNNER_TEMP/signing/keystore-certs.txt" | normalise)

          if [ -z "$apk_cert" ] || [ "$apk_cert" != "$keystore_cert" ]; then
            echo "::error::The APK is not signed by the staged release key."
            exit 1
          fi
          echo "APK certificate matches the staged release key."
          scripts/ci/apk-listed "$apk" ANDROID_FINGERPRINTS

      # Which artifact ships follows from how the job was configured, not from
      # which file happens to be on disk.
      - name: Stage the APK for upload
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          release_dir=frontend/android/app/build/outputs/apk/release
          mkdir -p artifacts
          if [ "$HAS_KEYSTORE" = 'true' ]; then
            cp "$release_dir/app-release.apk" "artifacts/initiative-$VERSION.apk"
            aab=frontend/android/app/build/outputs/bundle/release/app-release.aab
            if [ ! -f "$aab" ]; then
              echo "::error::Signing was configured but Gradle produced no app bundle."
              exit 1
            fi
            mkdir -p play
            cp "$aab" "play/initiative-$VERSION.aab"
          else
            cp "$release_dir/app-release-unsigned.apk" "artifacts/initiative-$VERSION-unsigned.apk"
          fi

      - name: Remove the staged signing keystore
        if: always()
        run: rm -rf "${RUNNER_TEMP:?}/signing"

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: artifacts/*.apk

      # For uploading to Google Play by hand; it is not attached to the GitHub Release.
      - name: Upload the Play bundle
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-aab
          path: play/*.aab

  build-desktop:
    needs: decide
    if: ${{ needs.decide.outputs.build_desktop == 'true' }}
    uses: ./.github/workflows/desktop-app.yml
    permissions:
      contents: read

  candidate:
    # The tree this run publishes, and whether Release Candidate built it and
    # walked it: then the release publishes that digest rather than a build.
    needs: decide
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read  # the candidate's server packages, in its run
    outputs:
      image: ${{ steps.find.outputs.image }}
      tree: ${{ steps.find.outputs.tree }}
      checked: ${{ steps.find.outputs.checked }}
      digest: ${{ steps.find.outputs.digest }}
      packages-run: ${{ steps.find.outputs.packages-run }}
      packages-artifact: ${{ steps.find.outputs.packages-artifact }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find this tree's candidate
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          # GHCR repository names are lowercase; the owner's login may not be.
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/initiative"
          echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          tree=$(git rev-parse 'HEAD^{tree}' | cut -c1-12)
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          # Resolved once, here: what is published is this digest, whatever
          # the tag points at by then.
          if digest=$(docker buildx imagetools inspect "$IMAGE_NAME:candidate-$tree" \
              --format '{{json .Manifest}}' 2>/dev/null | jq -er .digest); then
            echo "checked=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "Publishing candidate-$tree ($digest)"
          else
            echo "No checked candidate for this tree ($tree); building and walking one."
            exit 0
          fi
          # The server packages built from that image, in a Release Candidate
          # run on this release's branch that passed. Without them (they
          # expire after 30 days) they are built from the image below.
          artifact="server-package-release-${digest#sha256:}"
          want=$(printf '%s\t%s\t%s\t%s' .github/workflows/release-candidate.yml push "release/v$VERSION" success)
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact-deb-amd64" \
              --jq '.artifacts[] | select(.expired | not) | .workflow_run.id'); do
            if [[ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" \
                --jq '[.path, .event, .head_branch, .conclusion] | @tsv')" == "$want" ]]; then
              echo "packages-run=$run" >> "$GITHUB_OUTPUT"
              echo "packages-artifact=$artifact" >> "$GITHUB_OUTPUT"
              echo "Attaching the server packages from run $run"
              exit 0
            fi
          done
          echo "No server packages from the candidate's run; building them from it."

  docker-public:
    # Without a checked candidate for this tree (a tag on a tree no release
    # branch held, a candidate that did not pass, or a run by hand), the
    # image is built here and walked below before anything is tagged.
    needs: [decide, candidate]
    if: needs.candidate.outputs.checked != 'true'
    permissions:
      contents: read
      packages: write  # the push to GHCR
      id-token: write  # the image's signature
    uses: ./.github/workflows/docker-image.yml
    with:
      name: release
      labels: true
      signing-environment: ota-release
      build-args: |
        VERSION=${{ needs.decide.outputs.version }}
        VITE_API_URL=/api/v1
      tags: type=raw,value=unchecked-${{ needs.candidate.outputs.tree }}
    # inherit, not a list: the called job's environment secrets
    # (OTA_SIGNING_KEY) read as empty without it.
    secrets: inherit

  walk:
    needs: [candidate, docker-public]
    uses: ./.github/workflows/upgrade.yml
    with:
      mode: walk
      image: ${{ needs.docker-public.outputs.image }}@${{ needs.docker-public.outputs.digest }}

  journeys:
    needs: [candidate, docker-public]
    uses: ./.github/workflows/journeys.yml
    with:
      image: ${{ needs.docker-public.outputs.image }}@${{ needs.docker-public.outputs.digest }}

  build-server:
    # The server packages, built from the image this run publishes when
    # Release Candidate's run did not leave them (see candidate).
    needs: [candidate, docker-public]
    if: >-
      ${{ !cancelled() && needs.candidate.outputs.packages-run == ''
      && (needs.candidate.outputs.checked == 'true' || needs.docker-public.result == 'success') }}
    permissions:
      contents: read
      packages: read  # the pull of the image's web assets
    uses: ./.github/workflows/server-packages.yml
    with:
      image: ${{ needs.candidate.outputs.image }}@${{ needs.candidate.outputs.checked == 'true' && needs.candidate.outputs.digest || needs.docker-public.outputs.digest }}
    # inherit, not a list: the called job's environment secrets
    # (SERVER_APK_SIGNING_KEY) read as empty without it.
    secrets: inherit

  publish:
    # Tags the checked image as the release: the candidate, or the build
    # above once its walk and journeys passed. Nothing is published unchecked.
    # A release that moves a floor publishes only once that app is built, so
    # no server asks for an app that is not there; a skipped build passes.
    needs: [decide, candidate, docker-public, walk, journeys, build-android, build-desktop, build-server]
    if: >-
      ${{ !cancelled() && (needs.candidate.outputs.checked == 'true'
      || (needs.walk.result == 'success' && needs.journeys.result == 'success'))
      && needs.build-android.result != 'failure'
      && needs.build-desktop.result != 'failure'
      && (needs.candidate.outputs.packages-run != '' || needs.build-server.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the checked image as this release
        # A tag, or a run given a version, publishes the version tags;
        # a run by hand without one moves latest alone.
        env:
          DIGEST: ${{ needs.candidate.outputs.checked == 'true' && needs.candidate.outputs.digest || needs.docker-public.outputs.digest }}
          VERSION: ${{ needs.decide.outputs.version }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          [[ "$DIGEST" == sha256:* ]] || { echo "::error::No checked image digest to publish."; exit 1; }
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/initiative"
          tags=(-t "$IMAGE_NAME:latest")
          if [[ "$GITHUB_REF" == refs/tags/* || -n "$INPUT_VERSION" ]]; then
            IFS=. read -r major minor _ <<< "$VERSION"
            tags+=(-t "$IMAGE_NAME:$VERSION" -t "$IMAGE_NAME:$major.$minor" -t "$IMAGE_NAME:$major")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE_NAME@$DIGEST"
          docker buildx imagetools inspect "$IMAGE_NAME:latest"

  release:
    needs: [decide, candidate, build-android, build-desktop, build-server, publish]
    # Run even when the app builds were *skipped* (web-only release). Only the Docker manifest
    # must have been published, from the candidate or a walked build; the APK and the desktop
    # installers are attached opportunistically below. But a build *failure* on a native-change
    # release is a hard error — publishing then would advertise "updates over the air" while the
    # bumped minNativeVersion blocks OTA and no new app exists.
    if: >-
      always()
      && needs.publish.result == 'success'
      && needs.build-android.result != 'failure'
      && needs.build-desktop.result != 'failure'
      && (needs.candidate.outputs.packages-run != '' || needs.build-server.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read  # the candidate's server packages, in its run

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name the image
        # GHCR repository names are lowercase; the owner's login may not be.
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/initiative" >> "$GITHUB_ENV"

      - name: Download Android APK
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: artifacts

      - name: Download desktop installers
        if: needs.build-desktop.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: artifacts

      - name: Download native server packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.candidate.outputs.packages-artifact || needs.build-server.outputs.artifact }}-*
          merge-multiple: true
          path: artifacts/server
          # Release Candidate's run when the packages came from it, else this one.
          run-id: ${{ needs.candidate.outputs.packages-run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Verify native server artifact checksums
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: artifacts/server
        run: |
          manifests=( initiative-server-*.sha256 )
          test "${#manifests[@]}" -eq 4
          for manifest in "${manifests[@]}"; do
            sha256sum --check "$manifest"
          done

      - name: Extract changelog for version
        id: changelog
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APK_BUILT: ${{ needs.build-android.result == 'success' }}
          DESKTOP_BUILT: ${{ needs.build-desktop.result == 'success' }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          echo "Extracting changelog for version $VERSION"

          # Extract the section for this version from CHANGELOG.md
          # Matches ## [X.Y.Z] and captures until the next ## [ or end of file
          CHANGELOG=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") || index($0, "[v" ver "]")) {
                found = 1
                next
              }
            }
            found { print }
          ' CHANGELOG.md)

          # The changelog names its pictures by repository path, which a
          # release body resolves against the release's own URL.
          CHANGELOG=$(printf '%s\n' "$CHANGELOG" \
            | sed -E "s#\]\((docs/[^)]+)\)#](https://github.com/$GITHUB_REPOSITORY/raw/$GITHUB_SHA/\1)#g")

          # If no version-specific section found, provide fallback
          if [ -z "$CHANGELOG" ]; then
            echo "No changelog section found for version $VERSION"
            CHANGELOG="See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md) for details."
          fi

          # The native app is only rebuilt when the native shell changed (see the `decide`
          # job). Web-only releases ship no new APK — existing installs update over the air,
          # and an updater tracking these releases falls back to the last one that carried an
          # APK. Attaching an older APK here instead reads as a new version to those updaters,
          # which then reinstall the app they already have.
          if [ "$APK_BUILT" = "true" ]; then
            ANDROID_SECTION="### Android App
          Download the APK from the assets below and install on your Android device."
          else
            ANDROID_SECTION="### Android App
          No new app build this release — installed apps update automatically over the air on next launch."
          fi
          if [ "$DESKTOP_BUILT" = "true" ]; then
            DESKTOP_SECTION="### Desktop App
          Download the installer for your computer from the assets below: the .exe for Windows, the .dmg for macOS, the .deb for Debian and Ubuntu."
          else
            DESKTOP_SECTION="### Desktop App
          No new app build this release — installed apps update automatically over the air on next launch."
          fi

          # Build full release body with changelog + download info
          cat > release_body.md << ENDOFBODY
          $CHANGELOG

          ---

          ## Downloads

          $ANDROID_SECTION

          $DESKTOP_SECTION

          ### Native Server Packages
          Install the \`initiative-server\` .deb on Debian 13 or the .alpine package on Alpine 3.24 (with \`apk add\`), for amd64 or arm64.
          These packages run the server and are separate from the desktop .deb and Android APK above.
          The assets include SHA-256 checksums and the Alpine package public signing key.
          See [native server installation](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/en/running-a-server/native-packages.md) for configuration and service instructions.

          ### Docker Image
          \`\`\`bash
          docker pull ${IMAGE_NAME}:${VERSION}
          \`\`\`

          Or use the \`latest\` tag. View the [package on GitHub](https://github.com/${GITHUB_REPOSITORY}/pkgs/container/initiative).
          ENDOFBODY

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' release_body.md

      # What an installed plug-in may call, and the whole API: what API clients
      # check themselves against, and what the next release's compatibility check
      # compares with (scripts/ci/api-compat). Exported from the image this release
      # published; the image carries no scripts/, so the checkout's are mounted.
      - name: Export the API specs
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          mkdir -p artifacts
          export_spec() {
            docker run --rm --entrypoint python \
              -v "$PWD/backend/scripts:/app/scripts:ro" -v "$PWD/artifacts:/out" \
              "$IMAGE_NAME:$VERSION" scripts/export_openapi.py "$@"
          }
          export_spec /out/openapi.json
          export_spec --plugin /out/initiative-plugin-api.json

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/*.apk
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.deb
            artifacts/server/*
            artifacts/latest*.yml
            artifacts/openapi.json
            artifacts/initiative-plugin-api.json
          body_path: release_body.md
          draft: false
          prerelease: false

      - name: Discord Webhook Action
        uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645 # v7.0.0
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          content: ":tada: Initiative ${{ needs.decide.outputs.version }} has been published! Download the apk from the [GitHub Release](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}) or pull `ghcr.io/beyonders-studio/initiative:${{ needs.decide.outputs.version }}`."
