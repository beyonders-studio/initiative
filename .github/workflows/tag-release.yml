name: Tag Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    if: >-
      github.repository == 'beyonders-studio/initiative'
      && github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Everything that writes goes through the release app's token below, so
    # GITHUB_TOKEN only needs to read.
    permissions:
      contents: read

    steps:
      # GITHUB_TOKEN cannot open the back-merge pull request: the org keeps
      # "Allow GitHub Actions to create and approve pull requests" off, so
      # workflows cannot approve their own pull requests on dev. A tag pushed
      # by the app also starts Build and Release by itself, which a
      # GITHUB_TOKEN push does not.
      - name: Get the release app's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Push the tag and open the back-merge pull request. The tag points
          # at a commit already on main, so the push brings no new commits and
          # no workflow-file changes: no workflows grant needed.
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Extract version from branch name
        id: version
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION="${BRANCH#release/v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release branch does not name a version (expected release/vX.Y.Z)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION from branch: $BRANCH"

      - name: Tag as the release app
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"

      # Build and Release runs on the v*.*.* tag push, so this push starts it.
      - name: Create and push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Created and pushed tag $TAG"

      - name: Open the pull request merging main back into dev
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git diff --quiet origin/main origin/dev; then
            echo "main and dev are identical, no pull request needed"
            exit 0
          fi
          existing=$(gh pr list --head main --base dev --state open --json url --jq '.[0].url // empty')
          if [[ -n "$existing" ]]; then
            echo "A pull request merging main into dev is already open: $existing"
            exit 0
          fi
          # Through a pull request, so dev's review rule still applies. Any
          # failure here fails the step.
          gh pr create \
            --base dev \
            --head main \
            --title "Merge main back into dev after $TAG" \
            --body "Automated PR to sync \`main\` back into \`dev\` after release $TAG." \
            --label "sync"

  # A release pull request closed without merging leaves its branch, which the
  # next run of the release for that version would refuse to push over. The
  # candidate still building from it is cancelled, and the branch deleted.
  discard:
    if: >-
      github.repository == 'beyonders-studio/initiative'
      && github.event.pull_request.merged == false
      && startsWith(github.event.pull_request.head.ref, 'release/v')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Cancelling the branch's runs.
      actions: write

    steps:
      # Release branches can be deleted only by the release app (the
      # ruleset's bypass), so the deletion goes through its token.
      - name: Get the release app's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Cancel the branch's runs
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          for status in queued in_progress; do
            gh api "repos/$REPO/actions/runs?branch=$BRANCH&status=$status" \
              -q '.workflow_runs[].id' \
              | xargs -r -I{} gh api -X POST "repos/$REPO/actions/runs/{}/cancel" || true
          done

      - name: Delete the branch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$REPO/git/ref/heads/$BRANCH" --silent 2>/dev/null; then
            gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH"
            echo "Deleted $BRANCH."
          else
            echo "$BRANCH is already gone."
          fi
