name: Docker Image

# Builds the runtime image natively per platform, pushes each by digest, then
# merges the digests into one multi-arch manifest under the caller's tags.
# Called by Dev Build (dev tags) and Build and Release (semver + latest).

on:
  workflow_call:
    inputs:
      name:
        description: Distinguishes this caller's digest artifacts (e.g. dev, release).
        required: true
        type: string
      build-args:
        description: Docker build arguments, one KEY=value per line.
        required: false
        type: string
        default: ""
      labels:
        description: Attach docker/metadata-action's OCI labels to the image.
        required: false
        type: boolean
        default: false
      tags:
        description: docker/metadata-action tag rules for the merged manifest. The highest-priority tag is the one inspected.
        required: true
        type: string
      signing-environment:
        description: The environment whose OTA_SIGNING_KEY signs the app update (ota-release, ota-dev); the build fails without it. Empty builds an unsigned image.
        required: false
        type: string
        default: ""
    outputs:
      image:
        description: The image repository pushed to (ghcr.io/<owner>/initiative), without a tag.
        value: ${{ jobs.merge.outputs.image }}
      digest:
        description: The digest of the multi-arch manifest pushed, to name exactly this build.
        value: ${{ jobs.merge.outputs.digest }}
    # OTA_SIGNING_KEY comes from `signing-environment`, which reaches this
    # workflow only when the caller passes `secrets: inherit`. The registry is
    # GHCR, pushed to with the job's GITHUB_TOKEN: the caller grants
    # `packages: write`.

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    # Holds OTA_SIGNING_KEY, the key the app's updates are signed with.
    environment: ${{ inputs.signing-environment }}
    steps:
      - name: Prepare platform pair
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name the image
        # GHCR repository names are lowercase; the owner's login may not be.
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/initiative" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels) for Docker
        id: meta
        if: inputs.labels
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Require the app update signing key
        if: inputs.signing-environment != ''
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
          SIGNING_ENVIRONMENT: ${{ inputs.signing-environment }}
        run: |
          if [ -z "$OTA_SIGNING_KEY" ]; then
            echo "::error::OTA_SIGNING_KEY is not set in the $SIGNING_ENVIRONMENT environment; this image must carry a signed app update."
            exit 1
          fi

      - name: Cache the dependency stages
        # Every other layer differs from one build to the next: the runtime
        # stage refreshes its packages each time (APT_REFRESH), and a dev build
        # stamps its commit into the frontend. So the cache is written from
        # the stages built from the lockfiles alone, and the build below reads
        # it without writing; layers nothing reads back would push out the
        # ones something does.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          target: dependencies
          outputs: type=cacheonly
          cache-from: type=gha,scope=docker-build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=docker-build-${{ env.PLATFORM_PAIR }},mode=max

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # A new APT_REFRESH per run: every published image applies the
          # updates available when it was built, not those its cache holds.
          build-args: |
            APT_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
            ${{ inputs.build-args }}
          # From the environment: the key is a multi-line PEM, which the
          # line-per-entry `secrets` input splits apart.
          secret-envs: ${{ inputs.signing-environment != '' && 'ota_signing_key=OTA_SIGNING_KEY' || '' }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # What the image holds and how it was built, attached to it: the
          # merge below and every retag after it carry them along.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=docker-build-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ inputs.name }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      # The signature's certificate names this workflow and the ref it ran on.
      id-token: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - name: Name the image
        id: name
        # GHCR repository names are lowercase; the owner's login may not be.
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/initiative"
          echo "IMAGE_NAME=$image" >> "$GITHUB_ENV"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.name }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: ${{ inputs.tags }}

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE_NAME@sha256:%s " *)

      - name: Inspect image
        id: inspect
        if: steps.meta.outputs.version != ''
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME:$VERSION"
          digest=$(docker buildx imagetools inspect "$IMAGE_NAME:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Require the SBOM and provenance
        # Each platform's build attached them as an attestation manifest beside
        # its image; the merge carries them into this index.
        if: steps.inspect.outputs.digest != ''
        env:
          DIGEST: ${{ steps.inspect.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME@$DIGEST" --raw | jq -e '
            [.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] as $att
            | [.manifests[] | select(.platform.os != "unknown")] as $img
            | ($img | length) > 0 and ($att | length) == ($img | length)' > /dev/null \
            || { echo "::error::$IMAGE_NAME@$DIGEST lacks an attestation manifest for each platform"; exit 1; }

      - name: Install cosign
        if: steps.inspect.outputs.digest != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        # Keyless: the certificate is issued to this workflow on the ref it ran
        # on, and the signature is entered in the public transparency log, so
        # there is no key to keep. Signing the digest signs every tag that
        # names it, now and after a retag.
        if: steps.inspect.outputs.digest != ''
        env:
          DIGEST: ${{ steps.inspect.outputs.digest }}
        run: cosign sign --yes "$IMAGE_NAME@$DIGEST"
