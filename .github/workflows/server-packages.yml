name: Native Server Packages

# A release's server packages are built from its checked image: Release
# Candidate calls this with the candidate it built, and Build and Release with
# the image it publishes when no candidate carried them. The browser app,
# editor and signed app update are that image's, so a package serves what the
# walk and the journeys checked. A pull request or a run by hand builds test
# packages from source, signed with keys made for the run.
on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/server-packages.yml'
      - '.github/actions/setup-frontend/**'
      - 'packaging/server/**'
      - 'scripts/build-server-assets.sh'
      - 'frontend/scripts/sign-ota.mjs'
      # What the packages compile on each target, so a dependency that stops
      # building there fails its pull request rather than the release branch.
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'backend/uv-requirements.txt'
  workflow_call:
    inputs:
      image:
        description: The checked image (ghcr.io/<owner>/initiative@sha256:…) whose web assets the release packages carry. Empty builds test packages.
        type: string
        required: false
        default: ''
    outputs:
      artifact:
        description: What the package artifacts' names start with, one per format and architecture after it.
        value: ${{ jobs.assets.outputs.artifact }}

permissions:
  contents: read

jobs:
  packaging-tooling:
    name: Package tooling checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          save-cache: false
      - name: Install only lock-pinned package tooling
        # Keep the package builder checks independent of the app dependencies
        # and the more expensive browser/editor/OTA asset build.
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import subprocess
          import tomllib

          tooling = Path(os.environ["RUNNER_TEMP"]) / "server-tooling"
          locked = tomllib.loads(Path("backend/uv.lock").read_text())
          names = ("python-dotenv", "ruff", "ty")
          versions = {package["name"]: package["version"] for package in locked["package"] if package["name"] in names}
          requirements = [f"{name}=={versions[name]}" for name in names]
          subprocess.run(["uv", "venv", "--python", "3.13", str(tooling)], check=True)
          subprocess.run(["uv", "pip", "install", "--python", str(tooling / "bin/python"), *requirements], check=True)
          with open(os.environ["GITHUB_PATH"], "a") as path_file:
              path_file.write(str(tooling / "bin") + "\n")
          PYTHON
      - name: Test package tooling
        run: python -m unittest discover -s packaging/server -p '*_test.py'
      - name: Lint and check package tooling formatting
        run: |
          ruff check packaging/server
          ruff format --check packaging/server
      - name: Type check package tooling
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import subprocess
          import dotenv

          subprocess.run(["ty", "check", "packaging/server", "--extra-search-path", str(Path(dotenv.__file__).parent.parent)], check=True)
          PYTHON

  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read  # the pull of the checked image
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Name the packages
        id: name
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          # A release's packages carry the digest of the image they came from,
          # which is how Build and Release finds a candidate's.
          if [[ -z "$IMAGE" ]]; then
            echo "artifact=server-package-test" >> "$GITHUB_OUTPUT"
          elif [[ "$IMAGE" =~ @sha256:([0-9a-f]{64})$ ]]; then
            echo "artifact=server-package-release-${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The image is not named by its digest: $IMAGE"
            exit 1
          fi
      - uses: ./.github/actions/setup-frontend
        if: ${{ !inputs.image }}
      - name: Build test assets
        if: ${{ !inputs.image }}
        run: scripts/build-server-assets.sh --output "$RUNNER_TEMP/server-assets"
      - name: Log in to GHCR
        if: inputs.image
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Take the release assets from the checked image
        if: inputs.image
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          # The web assets do not depend on the platform, so one platform's
          # copy serves every package.
          container=$(docker create --platform linux/amd64 "$IMAGE")
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir -p "$RUNNER_TEMP/server-assets"
          docker cp "$container:/app/static" "$RUNNER_TEMP/server-assets/browser"
          docker cp "$container:/app/editor" "$RUNNER_TEMP/server-assets/editor"
          docker cp "$container:/app/ota" "$RUNNER_TEMP/server-assets/ota"
          chmod -R u=rwX,go=rX "$RUNNER_TEMP/server-assets"
      - name: Archive public assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-assets-${{ inputs.image && 'release' || 'test' }}
          path: ${{ runner.temp }}/server-assets/
          if-no-files-found: error
          retention-days: 2

  packages:
    needs: assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            arch: amd64
            runner: ubuntu-24.04
            image: debian:13-slim
          - format: deb
            arch: arm64
            runner: ubuntu-24.04-arm
            image: debian:13-slim
          - format: apk
            arch: amd64
            runner: ubuntu-24.04
            image: alpine:3.24
          - format: apk
            arch: arm64
            runner: ubuntu-24.04-arm
            image: alpine:3.24
    name: Server ${{ matrix.format }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: ${{ inputs.image && matrix.format == 'apk' && 'ota-release' || '' }}
    env:
      PACKAGE_FORMAT: ${{ matrix.format }}
      PACKAGE_ARCH: ${{ matrix.arch }}
      # Android updaters such as Obtainium take any release asset ending in .apk
      # for the phone app. apk add reads a package by its contents, so the Alpine
      # package is tested and shipped under a name of its own.
      PACKAGE_SUFFIX: ${{ matrix.format == 'apk' && 'alpine' || matrix.format }}
      BUILD_IMAGE: ${{ matrix.image }}
      BUILD_CHANNEL: ${{ inputs.image && 'release' || 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download shared assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-assets-${{ inputs.image && 'release' || 'test' }}
          path: ${{ runner.temp }}/server-assets
      - name: Restore target dependency cache
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # No fallback across lockfiles, distributions, or architectures.
          # Cache only dependencies, never package payloads or signing keys.
          path: |
            ${{ runner.temp }}/server-dependency-cache/uv
            ${{ runner.temp }}/server-dependency-cache/pip
            ${{ runner.temp }}/server-dependency-cache/cargo/registry
            ${{ runner.temp }}/server-dependency-cache/cargo/git
            ${{ runner.temp }}/server-dependency-cache/cargo-target
          key: server-dependencies-v1-${{ runner.os }}-${{ matrix.image }}-${{ matrix.arch }}-${{ hashFiles('backend/uv.lock', 'backend/uv-requirements.txt', 'packaging/server/**/build-dependencies.txt') }}
      - name: Prepare disposable APK test key
        if: ${{ matrix.format == 'apk' && !inputs.image }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/server-apk-signing"
          openssl genrsa -out "$RUNNER_TEMP/server-apk-signing/initiative-server.rsa" 2048
      - name: Require production APK signing key
        if: ${{ matrix.format == 'apk' && inputs.image }}
        env:
          SERVER_APK_SIGNING_KEY: ${{ secrets.SERVER_APK_SIGNING_KEY }}
        run: |
          test -n "$SERVER_APK_SIGNING_KEY" || { echo '::error::ota-release requires SERVER_APK_SIGNING_KEY (RSA PEM)'; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/server-apk-signing"
          printf '%s\n' "$SERVER_APK_SIGNING_KEY" > "$RUNNER_TEMP/server-apk-signing/initiative-server.rsa"
          unset SERVER_APK_SIGNING_KEY
          openssl rsa -in "$RUNNER_TEMP/server-apk-signing/initiative-server.rsa" -check -noout
      - name: Derive APK public trust key
        if: matrix.format == 'apk'
        run: |
          openssl rsa -in "$RUNNER_TEMP/server-apk-signing/initiative-server.rsa" -pubout \
            -out "$RUNNER_TEMP/server-apk-signing/initiative-server.rsa.pub"
      - name: Build packages using the target native Python and libc
        # These are disposable build environments; installed servers need no
        # container engine, Node, compiler, package resolver, or download step.
        run: |
          mkdir -p "$RUNNER_TEMP/server-output" "$RUNNER_TEMP/server-apk-signing" "$RUNNER_TEMP/server-dependency-cache"
          docker run --rm \
            -v "$PWD:/source:ro" \
            -v "$RUNNER_TEMP/server-assets:/assets:ro" \
            -v "$RUNNER_TEMP/server-output:/output" \
            -v "$RUNNER_TEMP/server-apk-signing:/run/server-signing:ro" \
            -v "$RUNNER_TEMP/server-dependency-cache:/root/.cache" \
            -e CARGO_HOME=/root/.cache/cargo \
            -e CARGO_TARGET_DIR=/root/.cache/cargo-target \
            -e PACKAGE_FORMAT -e BUILD_CHANNEL \
            -e APK_SIGNING_KEY=/run/server-signing/initiative-server.rsa \
            "$BUILD_IMAGE" sh -euc '
              if [ "$PACKAGE_FORMAT" = deb ]; then
                apt-get update
                xargs apt-get install -y --no-install-recommends < /source/packaging/server/debian/build-dependencies.txt
              else
                xargs apk add --no-cache < /source/packaging/server/alpine/build-dependencies.txt
              fi
              python3 -m unittest discover -s /source/packaging/server -p lifecycle_test.py -v
              sh /source/packaging/server/build.sh "$PACKAGE_FORMAT" --assets /assets --output /output --channel "$BUILD_CHANNEL" --revision 1
              sh /source/packaging/server/build.sh "$PACKAGE_FORMAT" --assets /assets --output /output/upgrade --channel "$BUILD_CHANNEL" --revision 2
            '
      - name: Make build outputs and dependency cache readable by the runner
        # Change only the outer artifact files; package-internal root ownership
        # is part of the archive and remains untouched.
        run: |
          sudo chown -R --no-dereference "$(id -u):$(id -g)" \
            "$RUNNER_TEMP/server-dependency-cache" "$RUNNER_TEMP/server-output"
          chmod -R u+rwX "$RUNNER_TEMP/server-dependency-cache" "$RUNNER_TEMP/server-output"
      - name: Give the packages their release names
        if: matrix.format == 'apk'
        run: |
          for package in "$RUNNER_TEMP"/server-output/*.apk "$RUNNER_TEMP"/server-output/upgrade/*.apk; do
            mv "$package" "${package%.apk}.$PACKAGE_SUFFIX"
          done
      - name: Save target dependency cache
        # PRs may restore trusted caches but never save their own. A successful
        # dependency/package build is reusable even if the runtime smoke fails.
        if: >-
          ${{ steps.dependencies.outputs.cache-hit != 'true'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && !startsWith(github.ref, 'refs/pull/') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/server-dependency-cache/uv
            ${{ runner.temp }}/server-dependency-cache/pip
            ${{ runner.temp }}/server-dependency-cache/cargo/registry
            ${{ runner.temp }}/server-dependency-cache/cargo/git
            ${{ runner.temp }}/server-dependency-cache/cargo-target
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Install, upgrade, and exercise the package in a clean target
        # No source checkout, assets, build tools, or private key in this target.
        run: |
          docker run --rm \
            -v "$PWD/packaging/server/smoke-test.sh:/smoke-test.sh:ro" \
            -v "$RUNNER_TEMP/server-output:/packages:ro" \
            -e PACKAGE_FORMAT -e PACKAGE_SUFFIX \
            "$BUILD_IMAGE" sh -euc '
              if [ "$PACKAGE_FORMAT" = deb ]; then
                apt-get update
                apt-get install -y --no-install-recommends bash
              else
                apk add --no-cache bash
              fi
              set -- /packages/*."$PACKAGE_SUFFIX"
              test "$#" -eq 1 && test -f "$1"
              package=$1
              set -- /packages/upgrade/*."$PACKAGE_SUFFIX"
              test "$#" -eq 1 && test -f "$1"
              if [ "$PACKAGE_FORMAT" = apk ]; then
                export APK_TRUSTED_KEY=/packages/initiative-server.rsa.pub
              fi
              bash /smoke-test.sh "$PACKAGE_FORMAT" "$package" "$1"
            '
      - name: Checksum release deliverables
        run: |
          cd "$RUNNER_TEMP/server-output"
          # Only package files and their public verification key are archived.
          files=( *."$PACKAGE_SUFFIX" )
          if [[ "$PACKAGE_FORMAT" == apk ]]; then
            files+=( initiative-server.rsa.pub )
          fi
          sha256sum "${files[@]}" > "initiative-server-$PACKAGE_FORMAT-$PACKAGE_ARCH.sha256"
      - name: Archive server packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.assets.outputs.artifact }}-${{ matrix.format }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/server-output/*.${{ env.PACKAGE_SUFFIX }}
            ${{ runner.temp }}/server-output/*.pub
            ${{ runner.temp }}/server-output/*.sha256
          if-no-files-found: error
          # Long enough for a release branch to wait on its pull request.
          retention-days: ${{ inputs.image && 30 || 7 }}
      - name: Remove APK private keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/server-apk-signing"
