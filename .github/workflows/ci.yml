name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
    # Skip app CI on docs-only pushes (the Documentation workflow handles those).
    # Left on pull_request so required checks still run for PRs.
    paths-ignore:
      - "docs/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

# A new push to a pull request replaces its run. A push to main or dev never
# cancels one in progress: it waits, and a later push takes its place in the
# queue, so the branch is always tested in order.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Finds the record of an earlier run that tested this tree.
      actions: read
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      backend_mode: ${{ steps.diff.outputs.backend_mode }}
      alembic: ${{ steps.diff.outputs.alembic }}
      seam: ${{ steps.diff.outputs.seam }}
      upgrade: ${{ steps.diff.outputs.upgrade }}
      frontend: ${{ steps.diff.outputs.frontend }}
      codegen: ${{ steps.diff.outputs.codegen }}
      tooling: ${{ steps.diff.outputs.tooling }}
      tested: ${{ steps.tested.outputs.tested }}
      raw_tree: ${{ steps.tested.outputs.raw_tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Look for a run that already tested this tree
        # A release tests the tree dev already tested, and the push to main and
        # the merge back into dev test it again. A run of ci.yml in this
        # repository that passed every test records the tree it tested (the
        # Record The Tested Tree job): `raw` when it is this exact tree, `tree`
        # when only the files a release rewrites differ. Without a record, or
        # if the lookup fails, everything runs as usual.
        id: tested
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { read -r raw; read -r tree; } < <(scripts/ci/tested_tree.sh)
          echo "raw_tree=$raw" >> "$GITHUB_OUTPUT"
          recorded() {
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$1&per_page=20" --jq '
              [.artifacts[] | select((.expired | not)
                and .workflow_run.head_repository_id == .workflow_run.repository_id)
              | .workflow_run.id] | .[]' |
            while read -r run; do
              if [[ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .path)" == .github/workflows/ci.yml ]]; then
                echo "$run"
                break
              fi
            done
          }
          if run=$(recorded "tested-raw-$raw") && [[ -n "$run" ]]; then
            echo "tested=raw" >> "$GITHUB_OUTPUT"
            echo "Run $run tested this exact tree."
          elif run=$(recorded "tested-tree-$tree") && [[ -n "$run" ]]; then
            echo "tested=tree" >> "$GITHUB_OUTPUT"
            echo "Run $run tested this tree but for the files a release rewrites."
          else
            echo "No earlier run tested this tree."
          fi

      - name: Diff against the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          # Whether the pull request's branch is in this repository, where
          # Release Candidate runs, rather than in a fork.
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          BEFORE: ${{ github.event.before }}
          TESTED: ${{ steps.tested.outputs.tested }}
        run: |
          # A pull request diffs against its base branch. A push diffs against
          # where the branch stood before it, so every commit of a multi-commit
          # push counts; with no usable `before` (a new branch, a force-push)
          # every path counts as changed.
          if [[ "$EVENT" == "pull_request" ]]; then
            BASE="origin/$BASE_REF"
          elif [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          else
            BASE=""
          fi
          changed() {
            if [[ -z "$BASE" ]]; then
              echo "(no diff base)"
            else
              git diff --name-only "$BASE...HEAD" -- "$@" || true
            fi
          }
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          backend() {
            # A tree an earlier run tested whole is not tested again. When the
            # files a release rewrites differ, the always-run core reads them.
            if [[ "$TESTED" == "raw" ]]; then
              out backend false
              echo "An earlier run tested this exact tree — skipping"
              return
            elif [[ "$TESTED" == "tree" ]]; then
              out backend true; out alembic false; out backend_mode core
              echo "An earlier run tested this tree but for the release's files — running the always-run core"
              return
            fi

            # Integration pushes run every test: they are the authoritative
            # whole-tree signal, and dev's run records the data pull requests
            # select tests from.
            if [[ "$EVENT" != "pull_request" ]]; then
              out backend true; out alembic true; out backend_mode full
              echo "Integration push — running every backend test"
              return
            fi

            # This workflow file is in scope for itself: it defines the roles,
            # URLs and services the backend job runs against.
            if [[ -n "$(changed .github/workflows/ci.yml .github/actions/setup-backend/ .github/actions/test-database/)" ]]; then
              out backend true; out alembic true; out backend_mode full
              echo "CI workflow changed — running every backend test"
              return
            fi

            local CHANGED
            CHANGED=$(changed backend/)
            if [[ -z "$CHANGED" ]]; then
              # Nothing in backend/, but the always-run core also holds the
              # backend's checks on files elsewhere (the locale catalogues, the
              # plugin-kit contract, the Android channels), so any change but
              # documentation runs it.
              if [[ -n "$(changed . ':!docs/' ':!*.md' ':!zensical.toml')" ]]; then
                out backend true; out alembic false; out backend_mode core
                echo "No backend changes — running the always-run core"
              else
                out backend false
                echo "Documentation only — skipping"
              fi
              return
            fi
            out backend true
            if grep -q '^backend/alembic/' <<<"$CHANGED"; then
              out alembic true
            else
              out alembic false
            fi

            # Test selection knows which code each test ran. It cannot see what
            # runs before any test — migrations, and the roles, grants and
            # policies a start renders — nor the harness, the dependencies, or
            # files that are not Python. A change to any of those runs every test.
            local UNSEEN
            UNSEEN=$( {
              grep -E '^backend/(alembic/|app/db/|app/testing/|app/core/(capabilities|config)\.py$|conftest\.py$|pytest\.ini$|pyproject\.toml$|uv\.lock$|scripts/ci/)' <<<"$CHANGED"
              grep '^backend/app/' <<<"$CHANGED" | grep -v '\.py$'
            } || true)
            if [[ -n "$UNSEEN" ]]; then
              out backend_mode full
              echo "Changes test selection cannot see — running every backend test:"
              while read -r path; do echo "  $path"; done <<<"$UNSEEN"
              return
            fi
            out backend_mode select
            echo "Running the always-run core and the tests this change reaches"
          }

          frontend() {
            # Pushes to the integration branches are whole-tree verification;
            # only pull requests use the changed-file shortcut. A tree an
            # earlier run tested whole, release files aside, is not tested again.
            if [[ -n "$TESTED" ]]; then
              out frontend false
              echo "An earlier run tested this tree — skipping"
            elif [[ "$EVENT" != "pull_request" ]]; then
              out frontend true
              echo "Integration push — running the full frontend suite"
            elif [[ -n "$(changed frontend/ .github/actions/setup-frontend/)" ]]; then
              out frontend true
              echo "Frontend changes detected"
            else
              out frontend false
              echo "No frontend changes — skipping"
            fi
          }

          codegen() {
            if [[ -n "$(changed backend/ frontend/orval.config.ts frontend/src/api/mutator.ts frontend/package.json \
                frontend/scripts/generate-api.sh scripts/build_env_contract.py env-contract.json .github/actions/)" ]]; then
              out codegen true
              echo "Backend or codegen config changes detected"
            else
              out codegen false
              echo "No backend or codegen config changes — skipping"
            fi
          }

          # The repository's own tooling: the git identity guard, the release
          # workflow's Android signing, and the scripts CI runs. Tested below,
          # in this job, when any of it changes.
          tooling() {
            if [[ "$EVENT" != "pull_request" ]] || [[ -n "$(changed .github/ frontend/.husky/ \
                scripts/ci/ scripts/git-identity-guard.sh scripts/git-identity-guard_test.sh)" ]]; then
              out tooling true
              echo "Tooling changed — testing it"
            else
              out tooling false
            fi
          }

          # The request-context conformance suite (pytest marker ``seam``) is
          # slow, so it runs where it pays for itself: every integration push,
          # and a pull request that touches the seam.
          seam() {
            if [[ "$EVENT" != "pull_request" ]] || [[ -n "$(changed .github/workflows/ci.yml \
                backend/app/db/ backend/app/api/deps.py backend/app/api/content_socket.py \
                backend/app/services/content_sockets.py backend/app/testing/ \
                backend/app/models/ backend/alembic/ backend/conftest.py \
                backend/app/api/v1/tenant_endpoints/{queues,counters,events,collaboration}.py \
                backend/app/api/v1/platform_endpoints/notifications.py)" ]]; then
              out seam true
              echo "Seam changed — running the conformance suite"
            else
              out seam false
            fi
          }

          # Upgrading a database a release wrote, by booting the images. A pull
          # request into dev upgrades from the newest release; every
          # integration push walks each release since WALK_FROM in turn. A
          # release pull request is walked by Release Candidate, on the image
          # it will publish.
          upgrade() {
            if [[ "$EVENT" == "pull_request" && "$BASE_REF" == "main" && "$HEAD_REF" == release/v* \
                && "$SAME_REPO" == "true" ]]; then
              out upgrade false
              echo "Release — Release Candidate walks every release on the image it publishes"
            elif [[ "$EVENT" != "pull_request" || "$BASE_REF" == "main" ]]; then
              out upgrade walk
              echo "Integration push or pull request into main — walking every release"
            elif [[ -n "$(changed .github/workflows/ci.yml .github/actions/setup-backend/ \
                Dockerfile .dockerignore backend/entrypoint.sh backend/start.sh \
                backend/app/main.py backend/alembic/ \
                backend/app/db/ backend/app/models/ backend/app/core/ \
                backend/app/testing/ backend/scripts/upgrade_seed.py \
                backend/scripts/upgrade_from_release.py backend/pyproject.toml \
                backend/uv.lock scripts/seed/ scripts/seed_dev_data.py)" ]]; then
              out upgrade hop
              echo "Schema, boot or image changed — upgrading from the newest release"
            else
              out upgrade false
            fi
          }

          backend
          seam
          upgrade
          frontend
          codegen
          tooling

          {
            echo "### What this run checks"
            echo
            echo "| Area | Decision |"
            echo "|---|---|"
            # shellcheck disable=SC2016 # literal backticks: Markdown code
            sed -E 's/^([^=]+)=(.*)$/| \1 | `\2` |/' "$GITHUB_OUTPUT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test the git identity guard
        if: steps.diff.outputs.tooling == 'true'
        run: ./scripts/git-identity-guard_test.sh

      - name: Set up Python
        if: steps.diff.outputs.tooling == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Test the Android signing workflow
        if: steps.diff.outputs.tooling == 'true'
        run: |
          pip install "pyyaml==6.0.3"
          python3 scripts/ci/android_signing_workflow_test.py

      - name: Test the test-run summary
        if: steps.diff.outputs.tooling == 'true'
        run: python3 scripts/ci/pytest_summary_test.py

      - name: Test the change detection
        if: steps.diff.outputs.tooling == 'true'
        run: python3 scripts/ci/change_detection_test.py

      - name: Test the monthly report
        if: steps.diff.outputs.tooling == 'true'
        run: python3 scripts/ci/monthly_report_test.py

  backend-tests:
    name: Backend Lint & Tests
    needs: changes
    # A failed change detection leaves the outputs empty, which runs the job.
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # Reads the test selection data dev's last run published.
      actions: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: initiative
          POSTGRES_PASSWORD: initiative
          POSTGRES_DB: initiative_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U initiative -d initiative_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Provisioner/migrations: DIRECT to Postgres (never pooled, like prod),
      # as app_provisioner — the same least-privilege role a deployment runs
      # migrations and guild provisioning with. Created by the bootstrap step
      # below, which runs the app's own bootstrap module. POSTGRES_USER stays the
      # cluster superuser, which conftest.py uses as test infrastructure
      # (CREATE DATABASE per worker, raw writes on FORCE-RLS tables).
      DATABASE_URL: postgresql+asyncpg://app_provisioner:app_provisioner@localhost:5432/initiative_test
      # Request + system engines: through PgBouncer in TRANSACTION mode
      # (started as a step below). The pooler environment is strictly harder
      # than direct Postgres, so one suite run proves both — and any
      # reintroduction of session-level SET ROLE/GUC state fails here before
      # merge (#784). Config: backend/scripts/ci/pgbouncer.ini.
      DATABASE_URL_APP: postgresql+asyncpg://app_user:app_user@localhost:6432/initiative_test
      DATABASE_URL_ADMIN: postgresql+asyncpg://app_admin:app_admin@localhost:6432/initiative_test
      # Fixed test-only key (64 hex chars). Not a secret: CI databases are ephemeral.
      SECRET_KEY: 3b9c63094f48ae5b21e23a9d6d34a8e6f1f1f24cb0a44c84a25e36c9d4a7f1d2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-backend

      - uses: ./.github/actions/setup-frontend

      - name: Build the document editor for the server
        # app/services/editor_engine.py runs it.
        working-directory: frontend
        run: pnpm build:editor-server

      - name: Frozen migrations are unchanged, one Alembic head
        # scripts/ci/check runs the same checks locally (and before a push).
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: scripts/ci/check migrations

      - name: Set up the test database
        # Before the migrations below, which connect as app_provisioner.
        uses: ./.github/actions/test-database

      - name: Run Alembic migrations
        # conftest.py auto-applies migrations before tests run, so this
        # explicit step is only valuable as an early-fail signal on PRs
        # that actually touch alembic/.
        if: needs.changes.outputs.alembic != 'false'
        run: |
          cd backend
          uv run alembic upgrade head

      - name: Lint with Ruff
        run: scripts/ci/check ruff

      - name: Check formatting with Ruff
        run: scripts/ci/check format

      - name: Type-check with ty
        # Full default rule set; the only exclusions are the SQLModel/ORM
        # false-positive rules disabled in backend/pyproject.toml
        # ([tool.ty.rules]), which is the single source of truth for the gate.
        run: scripts/ci/check ty

      - name: Fetch the test selection data dev last recorded
        # Which code each test ran, as dev's newest run recorded it. Every file
        # dev changed since then counts as changed, so the newest recording
        # selects the fewest tests. Without one, every test runs.
        if: needs.changes.outputs.backend_mode == 'select'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=test-selection-data&per_page=20" \
            --jq '[.artifacts[] | select(.workflow_run.head_branch == "dev" and (.expired | not))][0].workflow_run.id')
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n test-selection-data -D backend
          echo "Selecting from dev run $run_id"

      - name: Run tests (through the pooler)
        id: tests
        env:
          MODE: ${{ needs.changes.outputs.backend_mode || 'full' }}
          # Per-test recording needs the tracer that reports every line each
          # test runs. The sys.monitoring core reports a line only the first
          # time a process runs it, which credits it to one test.
          COVERAGE_CORE: ctrace
        run: |
          cd backend
          set -o pipefail
          if [[ "$MODE" == "select" && ! -f .testmondata ]]; then
            echo "::warning::No test selection data from dev, so running every test."
            MODE=full
          fi
          if [[ "$MODE" == "full" ]]; then
            # Every test, recording which code each ran. dev's recording is
            # the one published for pull requests to select from.
            status=0
            uv run python -m pytest app/ alembic/ -n auto --tb=short --durations=15 --testmon-noselect \
              | tee "$RUNNER_TEMP/pytest.log" || status=$?
            # 0 every test passed, 1 some failed: either way each one ran, so
            # the recording is complete.
            if (( status <= 1 )); then echo "recorded=true" >> "$GITHUB_OUTPUT"; fi
            exit $status
          fi
          # The core runs on every pull request; then the tests the change
          # reaches, by the code each ran on dev. Both run even if one fails.
          status=0
          uv run python -m pytest app/ alembic/ -n auto --tb=short --durations=15 -m always \
            | tee "$RUNNER_TEMP/pytest-core.log" || status=1
          [[ "$MODE" == "core" ]] && exit $status
          uv run python -m pytest app/ alembic/ -n auto --tb=short --durations=15 \
            -m "not always and not seam and not budget" --testmon-nocollect --testmon-forceselect \
            | tee "$RUNNER_TEMP/pytest.log" || [[ $? -eq 5 ]] || status=1
          exit $status

      - name: Publish the test selection data
        # A run with failures records too: a test that failed is selected
        # again until it passes. A run that stopped part way does not.
        if: >-
          ${{ !cancelled() && steps.tests.outputs.recorded == 'true'
          && github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-selection-data
          path: backend/.testmondata
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Prove the request-context seam
        if: needs.changes.outputs.seam == 'true'
        run: |
          cd backend
          set -o pipefail
          uv run python -m pytest -m seam app/db/seam_conformance_test.py -n 2 --tb=short \
            | tee "$RUNNER_TEMP/pytest-seam.log"

      - name: Summarise the test run
        # The result, failures grouped by worker, and the slowest tests, on the
        # run's summary page.
        if: ${{ !cancelled() }}
        run: |
          {
            python3 scripts/ci/pytest_summary.py "$RUNNER_TEMP/pytest-core.log" "Always-run core"
            python3 scripts/ci/pytest_summary.py "$RUNNER_TEMP/pytest.log" "Backend tests"
            python3 scripts/ci/pytest_summary.py "$RUNNER_TEMP/pytest-seam.log" "Request-context seam"
          } >> "$GITHUB_STEP_SUMMARY"

  record-tested-tree:
    name: Record The Tested Tree
    needs: [changes, backend-tests, frontend-lint-and-test]
    # The tree every backend and frontend test, and the seam suite, passed on,
    # so a later run of the same tree can skip them (Detect Changes). A run that
    # ran the core because only a release's files differed records the exact
    # tree it checked. Only this repository's own branches record.
    if: >-
      ${{ !cancelled()
      && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
      && needs.backend-tests.result == 'success'
      && ((needs.changes.outputs.backend_mode == 'full' && needs.changes.outputs.seam == 'true'
          && needs.frontend-lint-and-test.result == 'success')
        || needs.changes.outputs.tested == 'tree') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name the tree
        id: ids
        run: |
          { read -r raw; read -r tree; } < <(scripts/ci/tested_tree.sh)
          { echo "raw=$raw"; echo "tree=$tree"; } >> "$GITHUB_OUTPUT"
          printf '%s\n%s\n%s\n' "$GITHUB_SHA" "$raw" "$tree" > "$RUNNER_TEMP/tested-tree.txt"

      - name: Record the exact tree
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-raw-${{ steps.ids.outputs.raw }}
          path: ${{ runner.temp }}/tested-tree.txt
          retention-days: 30

      - name: Record the tree without the release's files
        if: needs.changes.outputs.backend_mode == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-tree-${{ steps.ids.outputs.tree }}
          path: ${{ runner.temp }}/tested-tree.txt
          retention-days: 30

  upgrade-from-release:
    name: Upgrade From Release
    needs: changes
    # A failed change detection leaves the outputs empty, which runs the job.
    if: ${{ !cancelled() && needs.changes.outputs.upgrade != 'false' }}
    uses: ./.github/workflows/upgrade.yml
    with:
      mode: ${{ needs.changes.outputs.upgrade || 'hop' }}

  frontend-lint-and-test:
    name: Frontend Lint & Tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-frontend

      - name: Lint
        run: scripts/ci/check biome

      - name: TypeScript Check
        run: scripts/ci/check tsc

      - name: Run tests
        run: |
          cd frontend
          pnpm test:run

  check-generated-types:
    name: Check Generated Types
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.codegen != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-backend
        with:
          dev: "false"

      - uses: ./.github/actions/setup-frontend

      - name: Check env-contract.json and the generated API client
        run: scripts/ci/check codegen

      - name: The API takes what the last release's did
        # Breaking changes made on purpose are listed in
        # backend/api-breaking-changes.md.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/api-compat

  dev-image:
    name: Dev Image
    needs:
      - changes
      - backend-tests
      - upgrade-from-release
      - frontend-lint-and-test
      - check-generated-types
    # Publishes :dev from a push to dev once every check above has passed on
    # it (a check that had nothing to test is skipped, which counts as a pass).
    # To build one without waiting, run Dev Build by hand.
    if: >-
      ${{ !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/dev'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: read
      packages: write  # the push to GHCR
      id-token: write  # the image's signature
    uses: ./.github/workflows/dev-build.yml
    # inherit, not a list: the build's environment secrets (OTA_SIGNING_KEY)
    # read as empty without it.
    secrets: inherit
