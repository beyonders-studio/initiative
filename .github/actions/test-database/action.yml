name: Set up the test database
description: >-
  Create the app's database logins, then put PgBouncer in transaction mode in
  front of the request and system logins. Expects the job's postgres service
  on 5432 and the DATABASE_URL settings in the job's env.

runs:
  using: composite
  steps:
    - name: Trade durability for speed
      # The suite writes several GB of WAL (a TRUNCATE per test, a guild schema
      # per guild id above the pool), and with the defaults every commit waits
      # on a flush and every checkpoint syncs hundreds of thousands of relation
      # files. The cluster is thrown away with the job, so it runs as the local
      # docker-compose db does (CLAUDE.md, Running Tests). A service container
      # takes no command line, but these three reload.
      shell: bash
      env:
        PGPASSWORD: initiative
      run: |
        psql -h localhost -U initiative -d initiative_test -v ON_ERROR_STOP=1 -q \
          -c "ALTER SYSTEM SET fsync = off" \
          -c "ALTER SYSTEM SET synchronous_commit = off" \
          -c "ALTER SYSTEM SET full_page_writes = off" \
          -c "SELECT pg_reload_conf()"
        psql -h localhost -U initiative -d initiative_test -At \
          -c "SELECT name || '=' || setting FROM pg_settings WHERE name IN ('fsync', 'synchronous_commit', 'full_page_writes') ORDER BY name"

    - name: Bootstrap database roles
      # The same module a deployment runs at startup, over the same kind of
      # owner connection: it creates the three login roles, hands the app's
      # schema to app_provisioner, and installs the guild-search match
      # operator.
      shell: bash
      working-directory: backend
      env:
        DATABASE_URL_BOOTSTRAP: postgresql+asyncpg://initiative:initiative@localhost:5432/initiative_test
      run: uv run python -m app.db.bootstrap

    - name: Start PgBouncer (transaction mode)
      # edoburu/pgbouncer is pinned; PgBouncer >= 1.21 is required for
      # max_prepared_statements (asyncpg keeps its normal prepared-statement
      # cache — there is no app-side pooler mode).
      shell: bash
      run: |
        printf '"app_user" "app_user"\n"app_admin" "app_admin"\n' > /tmp/pgb-userlist.txt
        docker run -d --name ci-pgbouncer --network host \
          -v "$GITHUB_WORKSPACE/backend/scripts/ci/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro" \
          -v /tmp/pgb-userlist.txt:/etc/pgbouncer/userlist.txt:ro \
          edoburu/pgbouncer:v1.24.1-p1
        timeout 30 bash -c 'until (echo > /dev/tcp/127.0.0.1/6432) 2>/dev/null; do sleep 1; done'
        echo "PgBouncer up on :6432 (transaction mode)"
