version: 2
updates:
  # Backend (uv): pyproject.toml and uv.lock move together, which
  # `uv sync --locked` in CI and the server packages requires.
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    target-branch: "dev"
    ignore:
      # Pinned in uv-requirements.txt, below.
      - dependency-name: "uv"

  # uv itself, pinned with hashes in backend/uv-requirements.txt for the
  # image build.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    target-branch: "dev"
    allow:
      - dependency-name: "uv"

  # Frontend (npm/pnpm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    target-branch: "dev"
    cooldown:
      default-days: 5
      semver-major-days: 7
      semver-minor-days: 5
      semver-patch-days: 3
    # Bump package families as a single PR. lexical and capacitor are released
    # in lockstep (mixed versions within the family are a broken state); the
    # rest are grouped to cut PR noise.
    groups:
      lexical:
        patterns:
          - "lexical"
          - "@lexical/*"
      capacitor:
        patterns:
          - "@capacitor/*"
          - "@capacitor-community/*"
      radix-ui:
        patterns:
          - "@radix-ui/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      dnd-kit:
        patterns:
          - "@dnd-kit/*"
      testing-library:
        patterns:
          - "@testing-library/*"
      # The browser MCP server (.mcp.json) runs the Chromium @playwright/test
      # installs: an override in frontend/pnpm-workspace.yaml keeps
      # @playwright/mcp on @playwright/test's Playwright, and
      # frontend/src/__tests__/playwrightMcp.test.ts fails if the two part.
      playwright:
        patterns:
          - "@playwright/*"
    # Dev-only build tools — vulnerabilities in these don't affect production.
    # Security alerts for these are dismissed via auto-triage rules in
    # Settings > Advanced Security > Dependabot rules.
    ignore:
      - dependency-name: "minimatch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tar"
        update-types: ["version-update:semver-major"]
      - dependency-name: "esbuild"
        update-types: ["version-update:semver-major"]

  # Container base-image digests. Language-version changes stay deliberate;
  # Dependabot moves the immutable digest behind the readable current tag.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    target-branch: "dev"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    target-branch: "dev"
